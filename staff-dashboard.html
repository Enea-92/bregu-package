<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bregu — Paneli i stafit</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');
:root{
  --ink:#12302E; --sea:#0E3A3D; --sand:#F3ECDC; --sand-dim:#E7DEC8;
  --aqua-dark:#186D66; --gold:#CE9A42; --coral:#C1592E; --line:rgba(18,48,46,0.14); --white:#FFFDF8;
}
*{box-sizing:border-box;}
body{ margin:0; font-family:'Work Sans',sans-serif; background:var(--sand-dim); color:var(--ink); }
.topbar{ background:var(--sea); color:var(--sand); padding:18px 24px; display:flex; justify-content:space-between; align-items:center; }
.topbar h1{ font-family:'Fraunces',serif; font-size:20px; font-weight:500; margin:0; }
.conn{ font-family:'IBM Plex Mono',monospace; font-size:11px; padding:4px 10px; border-radius:5px; background:rgba(243,236,220,0.12); }
.conn.on{ background:var(--aqua-dark); }
.config-row{ display:flex; gap:8px; align-items:center; }
.config-row input{ font-family:'IBM Plex Mono',monospace; font-size:11px; border:0.5px solid rgba(243,236,220,0.4); background:rgba(243,236,220,0.08); color:var(--sand); border-radius:5px; padding:5px 8px; width:220px; }
.config-row button{ font-size:11px; border:none; background:var(--gold); color:var(--ink); border-radius:5px; padding:5px 10px; cursor:pointer; font-weight:500; }

.board{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; padding:20px; max-width:1200px; margin:0 auto; }
@media (max-width:900px){ .board{ grid-template-columns:1fr; } }
.col{ background:var(--white); border:0.5px solid var(--line); border-radius:12px; padding:14px 16px; min-height:200px; }
.col h2{ font-size:13px; text-transform:uppercase; letter-spacing:0.06em; opacity:0.6; margin:0 0 12px; display:flex; justify-content:space-between; }
.badge{ background:var(--sand-dim); color:var(--sea); border-radius:10px; padding:1px 8px; font-size:11px; }

.card{ border:0.5px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:13px; }
.card-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
.card-room{ font-family:'IBM Plex Mono',monospace; font-weight:500; color:var(--aqua-dark); }
.card-time{ font-size:10.5px; opacity:0.45; }
.card-body{ opacity:0.85; line-height:1.5; }
.card-btn{ margin-top:8px; border:none; background:var(--sea); color:var(--sand); font-size:11.5px; padding:5px 10px; border-radius:6px; cursor:pointer; }
.empty{ font-size:12.5px; opacity:0.4; padding:10px 0; }

.chat-col{ grid-column:1 / -1; }
.chat-room-list{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.room-pill{ border:0.5px solid var(--line); background:var(--sand-dim); border-radius:14px; padding:5px 12px; font-size:12px; cursor:pointer; font-family:'IBM Plex Mono',monospace; }
.room-pill.on{ background:var(--sea); color:var(--sand); }
.chat-thread{ max-height:280px; overflow-y:auto; border:0.5px solid var(--line); border-radius:10px; padding:10px; margin-bottom:10px; }
.msg{ max-width:70%; margin-bottom:8px; font-size:13px; padding:8px 12px; border-radius:10px; line-height:1.5; }
.msg.guest{ background:var(--sand-dim); }
.msg.staff{ background:var(--sea); color:var(--sand); margin-left:auto; }
.reply-row{ display:flex; gap:8px; }
.reply-row input{ flex:1; border:0.5px solid var(--line); border-radius:8px; padding:9px 12px; font-family:inherit; font-size:13px; }
.reply-row button{ border:none; background:var(--sea); color:var(--sand); border-radius:8px; padding:9px 16px; cursor:pointer; font-size:13px; }
</style>
</head>
<body>

<div class="topbar">
  <h1>Bregu — Paneli i stafit</h1>
  <div class="config-row">
    <span class="conn" id="conn-status">● jo i lidhur</span>
    <input id="backend-url" placeholder="https://bregu-package.onrender.com" value="https://bregu-package.onrender.com">
    <button onclick="connect()">Lidhu</button>
  </div>
</div>

<div class="board">
  <div class="col">
    <h2>Kërkesa të shpejta <span class="badge" id="req-count">0</span></h2>
    <div id="requests-list"><p class="empty">Asnjë kërkesë pezull.</p></div>
  </div>

  <div class="col">
    <h2>Porosi room-service <span class="badge" id="order-count">0</span></h2>
    <div id="orders-list"><p class="empty">Asnjë porosi pezull.</p></div>
  </div>

  <div class="col">
    <h2>Vlerësime të fundit</h2>
    <div id="feedback-list"><p class="empty">Ende pa vlerësime.</p></div>
  </div>

  <div class="col chat-col">
    <h2>Chat me dhomat</h2>
    <div class="chat-room-list" id="room-list"></div>
    <div class="chat-thread" id="chat-thread"><p class="empty">Zgjidhni një dhomë për të parë bisedën.</p></div>
    <div class="reply-row">
      <input id="reply-input" placeholder="Përgjigju mysafirit..." onkeydown="if(event.key==='Enter')sendReply()">
      <button onclick="sendReply()">Dërgo</button>
    </div>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
let socket = null;
let apiBase = 'https://bregu-package.onrender.com';
let activeRoom = null;
let knownRooms = new Set();
let allMessages = [];

function connect(){
  apiBase = document.getElementById('backend-url').value.trim().replace(/\/$/, '');
  if(socket) socket.disconnect();
  socket = io(apiBase, { transports: ['websocket', 'polling'] });

  socket.on('connect', () => {
    document.getElementById('conn-status').textContent = '● i lidhur';
    document.getElementById('conn-status').classList.add('on');
    socket.emit('join_staff');
    loadAll();
  });
  socket.on('disconnect', () => {
    document.getElementById('conn-status').textContent = '● shkëputur';
    document.getElementById('conn-status').classList.remove('on');
  });
  socket.on('new_request', () => loadRequests());
  socket.on('request_updated', () => loadRequests());
  socket.on('new_order', () => loadOrders());
  socket.on('order_updated', () => loadOrders());
  socket.on('new_message', (msg) => {
    knownRooms.add(msg.room_number);
    renderRoomList();
    if(msg.room_number === activeRoom){
      allMessages.push(msg);
      renderThread();
    }
  });
}

async function loadAll(){
  loadRequests();
  loadOrders();
  loadFeedback();
  const res = await fetch(apiBase + '/api/messages');
  const msgs = await res.json();
  msgs.forEach(m => knownRooms.add(m.room_number));
  renderRoomList();
}

async function loadRequests(){
  const res = await fetch(apiBase + '/api/quick-requests');
  const items = await res.json();
  document.getElementById('req-count').textContent = items.length;
  const box = document.getElementById('requests-list');
  box.innerHTML = items.length === 0 ? '<p class="empty">Asnjë kërkesë pezull.</p>' : items.map(r => `
    <div class="card">
      <div class="card-top"><span class="card-room">Dhoma ${r.room_number}</span><span class="card-time">${r.created_at}</span></div>
      <div class="card-body">${r.request_type}</div>
      <button class="card-btn" onclick="markRequestDone(${r.id})">Shëno si kryer</button>
    </div>`).join('');
}

async function markRequestDone(id){
  await fetch(apiBase + '/api/quick-requests/' + id, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({status:'done'}) });
  loadRequests();
}

async function loadOrders(){
  const res = await fetch(apiBase + '/api/room-service');
  const orders = await res.json();
  document.getElementById('order-count').textContent = orders.length;
  const box = document.getElementById('orders-list');
  box.innerHTML = orders.length === 0 ? '<p class="empty">Asnjë porosi pezull.</p>' : orders.map(o => `
    <div class="card">
      <div class="card-top"><span class="card-room">Dhoma ${o.room_number}</span><span class="card-time">${o.total} L</span></div>
      <div class="card-body">${o.items.map(i=>i.name).join(', ')}</div>
      <button class="card-btn" onclick="markOrderDelivered(${o.id})">Shëno si dorëzuar</button>
    </div>`).join('');
}

async function markOrderDelivered(id){
  await fetch(apiBase + '/api/room-service/' + id, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({status:'delivered'}) });
  loadOrders();
}

async function loadFeedback(){
  const res = await fetch(apiBase + '/api/feedback');
  const items = await res.json();
  const box = document.getElementById('feedback-list');
  box.innerHTML = items.length === 0 ? '<p class="empty">Ende pa vlerësime.</p>' : items.slice(0,10).map(f => `
    <div class="card">
      <div class="card-top"><span class="card-room">Dhoma ${f.room_number}</span><span class="card-time">${'★'.repeat(f.rating)}</span></div>
      <div class="card-body">${f.comment || ''}</div>
    </div>`).join('');
}

function renderRoomList(){
  const box = document.getElementById('room-list');
  box.innerHTML = [...knownRooms].sort().map(r => `<button class="room-pill ${r===activeRoom?'on':''}" onclick="openRoom('${r}')">Dhoma ${r}</button>`).join('');
}

async function openRoom(room){
  activeRoom = room;
  renderRoomList();
  socket.emit('join_room', room);
  const res = await fetch(apiBase + '/api/messages/' + room);
  allMessages = await res.json();
  renderThread();
}

function renderThread(){
  const box = document.getElementById('chat-thread');
  box.innerHTML = allMessages.map(m => `<div class="msg ${m.sender}">${m.text}</div>`).join('');
  box.scrollTop = box.scrollHeight;
}

window.addEventListener('DOMContentLoaded', connect);

async function sendReply(){
  const input = document.getElementById('reply-input');
  const text = input.value.trim();
  if(!text || !activeRoom) return;
  await fetch(apiBase + '/api/messages', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({room_number: activeRoom, sender:'staff', text}) });
  input.value = '';
}
</script>
</body>
</html>
